[package]
name = "relay-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Noteece Team"]
description = "Blind Relay Server for Noteece P2P Sync"

[lib]
name = "relay_server"
path = "src/lib.rs"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3"
rand = "0.8"
hex = "0.4"
core-rs = { path = "../core-rs" }

[dev-dependencies]
base64 = "0.21"
ed25519-dalek = "2.2.0"
tower = { version = "0.4", features = ["util"] }
http = "1.4.2"
http-body-util = "0.1"
