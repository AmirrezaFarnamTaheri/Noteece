[package]
name = "relay-server"
version = "1.1.0"
edition = "2021"
authors = ["Noteece Team"]
description = "Blind Relay Server for Noteece P2P Sync"

[lib]
name = "relay_server"
path = "src/lib.rs"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
core-rs = { path = "../core-rs" }
jsonwebtoken = "9"
axum-extra = { version = "0.9", features = ["typed-header"] }
rand = "0.8"
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http = "1"
http-body-util = "0.1"
