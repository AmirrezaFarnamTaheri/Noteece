name: Prepare unified dependency integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate convergence branch
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package manifests
        run: |
          node -e "for (const f of ['package.json','apps/desktop/package.json','apps/mobile/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"

      - name: Validate Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo format check
        run: cargo fmt --all -- --check
