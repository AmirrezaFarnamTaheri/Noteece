name: Security

# Supply-chain and static-analysis scanning. Runs on PRs, pushes to main, and a
# weekly schedule so newly-disclosed advisories are caught even without a code change.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Least privilege by default; individual jobs opt into what they need.
permissions:
  contents: read

jobs:
  cargo-audit:
    name: "Rust dependency audit (cargo-audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        # Fail the build on any known advisory in the committed Cargo.lock.
        run: cargo audit

  pnpm-audit:
    name: "JS dependency audit (pnpm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # KNOWN BACKLOG — this gate reports but does not yet block.
      #
      # The repo currently carries 146 advisories (6 critical / 87 high), all
      # pre-existing and none introduced by the change that added this workflow.
      # The bulk sit in dev/build tooling (eslint -> minimatch -> brace-expansion,
      # jest-expo -> react-server-dom-webpack, @expo/metro-config -> postcss), but
      # --prod alone does NOT come back clean either, so shipped dependencies are
      # affected too and clearing this needs a real dependency-upgrade pass.
      #
      # Deliberately left non-blocking so the backlog is visible on every run
      # rather than hidden behind a narrowed filter. Flip `continue-on-error` to
      # false once the advisories are triaged — that is the ratchet, and it should
      # happen as its own piece of work, not silently.
      - name: Run pnpm audit (production deps, high severity and above)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Report full dependency-tree advisories
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level high

  codeql:
    name: "CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "rust"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # Must be `languages` (plural) — `language` is silently ignored, which
          # makes CodeQL auto-detect every language and try to autobuild Java.
          languages: ${{ matrix.language }}
          # Neither target needs a compiled database, so skip autobuild entirely.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
