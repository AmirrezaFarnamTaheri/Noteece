name: Materialize dependency convergence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-dependency-convergence.yml

permissions:
  contents: read

jobs:
  materialize:
    name: Generate coordinated manifests and lockfiles
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update coupled JavaScript dependency families
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const direct = new Map([
            ['@types/node', '26.1.2'],
            ['date-fns', '4.4.0'],
            ['eslint-plugin-security', '4.0.1'],
          ]);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['.git', 'node_modules', 'target'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name === 'package.json') update(full);
            }
          }

          function update(file) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            let changed = false;
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              const deps = pkg[section];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                let target = direct.get(name);
                if (name === 'lexical' || name.startsWith('@lexical/')) target = '0.48.0';
                if (name.startsWith('@mantine/')) target = '9.5.0';
                if (!target) continue;
                const prefix = deps[name].startsWith('~') ? '~' : deps[name].startsWith('^') ? '^' : '';
                const next = `${prefix}${target}`;
                if (deps[name] !== next) {
                  console.log(`${file}: ${name} ${deps[name]} -> ${next}`);
                  deps[name] = next;
                  changed = true;
                }
              }
            }
            if (changed) fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }

          walk('.');
          NODE

      - name: Update coordinated Rust dependencies
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          targets = {
              'pbkdf2': '0.13.0',
              'sha2': '0.11.0',
              'cxx': '1.0.198',
              'tracing': '0.1.44',
              'regex': '1.13.1',
              'mdns-sd': '0.20.0',
              'gray_matter': '0.3.2',
              'http': '1.4.2',
              'serde': '1.0.229',
              'async-trait': '0.1.91',
              'env_logger': '0.11.9',
          }

          for path in Path('.').rglob('Cargo.toml'):
              if any(part in {'.git', 'target'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for name, version in targets.items():
                  simple = re.compile(rf'(?m)^(\s*{re.escape(name)}\s*=\s*")([^"]+)(".*)$')
                  inline = re.compile(rf'(?m)^(\s*{re.escape(name)}\s*=\s*\{{[^}}\n]*?\bversion\s*=\s*")([^"]+)("[^}}\n]*\}}.*)$')
                  text, n1 = simple.subn(rf'\g<1>{version}\g<3>', text)
                  text, n2 = inline.subn(rf'\g<1>{version}\g<3>', text)
                  if n1 or n2:
                      print(f'{path}: {name} -> {version}')
              if text != original:
                  path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate pnpm lockfile
        run: |
          set -euxo pipefail
          pnpm install --lockfile-only --ignore-scripts --reporter=append-only

      - name: Regenerate Cargo lockfile
        run: |
          set -euxo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Validate generated state
        run: |
          set -euxo pipefail
          node scripts/check-ipc-contract.mjs
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          cargo check --locked -p core-rs --all-targets --all-features
          cargo check --locked -p relay-server --all-targets
          cargo fmt --all -- --check
          git diff --check
          git status --short

      - name: Package changed files
        run: |
          set -euxo pipefail
          git diff --name-only -z --diff-filter=ACMRT | tar --null -T - -czf dependency-convergence.tar.gz
          sha256sum dependency-convergence.tar.gz
          git diff --stat

      - name: Upload convergence payload
        uses: actions/upload-artifact@v4
        with:
          name: dependency-convergence
          path: dependency-convergence.tar.gz
          if-no-files-found: error
          retention-days: 1
