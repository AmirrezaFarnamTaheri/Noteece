name: PR 131 one-shot repair

on:
  push:
    branches:
      - claude/omni-execution-protocol-4sn12p

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: claude/omni-execution-protocol-4sn12p
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply deterministic repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backup = Path('packages/core-rs/src/social/backup.rs')
          text = backup.read_text()
          old = '''#[cfg(windows)]
          fn sync_directory(path: &Path) -> std::io::Result<()> {
              use std::os::windows::fs::OpenOptionsExt;

              const FILE_FLAG_BACKUP_SEMANTICS: u32 = 0x0200_0000;
              OpenOptions::new()
                  .read(true)
                  .custom_flags(FILE_FLAG_BACKUP_SEMANTICS)
                  .open(path)?
                  .sync_all()
          }
          '''
          new = '''#[cfg(windows)]
          fn sync_directory(_path: &Path) -> std::io::Result<()> {
              // Rust's standard library does not expose a portable, reliable directory
              // fsync on Windows. The backup file itself is synced before the atomic
              // rename, so do not turn a successful backup into AccessDenied here.
              Ok(())
          }
          '''
          if old not in text:
              raise SystemExit('Windows sync_directory block did not match expected source')
          backup.write_text(text.replace(old, new, 1))

          attrs = Path('.gitattributes')
          attr_text = attrs.read_text()
          rule = 'packages/core-rs/config/bundled_selectors.json text eol=lf\n'
          if rule not in attr_text:
              if attr_text and not attr_text.endswith('\n'):
                  attr_text += '\n'
              attrs.write_text(attr_text + rule)

          security = Path('.github/workflows/security.yml')
          workflow = security.read_text()
          old_install = '      - name: Install cargo-audit\n        run: cargo install cargo-audit --locked\n'
          new_install = '''      - name: Install cargo-audit when absent
                  shell: bash
                  run: |
                    if ! command -v cargo-audit >/dev/null 2>&1; then
                      cargo install cargo-audit --locked
                    fi
          '''
          if old_install not in workflow:
              raise SystemExit('cargo-audit install step did not match expected workflow')
          security.write_text(workflow.replace(old_install, new_install, 1))
          PY

          cargo fmt --all
          rm .github/workflows/pr131-repair.yml
          git diff --check

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix cross-platform CI and format Rust sources'
          git push origin HEAD:claude/omni-execution-protocol-4sn12p
