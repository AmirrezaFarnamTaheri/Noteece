name: Materialize dependency convergence
run-name: "Materialize convergence | PR #${{ github.event.pull_request.number }} | ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-convergence.yml

permissions:
  contents: write

concurrency:
  group: materialize-convergence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "true"
  RUST_BACKTRACE: full

jobs:
  generate:
    name: Generate, validate, and commit manifests and lockfiles
    if: >-
      github.event.pull_request.number == 152 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            wget
          pkg-config --modversion gdk-3.0
          pkg-config --modversion webkit2gtk-4.0

      - name: Describe convergence environment
        run: |
          set -euxo pipefail
          git status --short --branch
          git log -1 --oneline --decorate
          node --version
          pnpm --version
          python3 --version
          rustc -Vv
          cargo -Vv

      - name: Apply compatible JavaScript dependency versions
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const exact = new Map([['date-fns', '4.4.0']]);

          function updatePackage(file) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            let changed = false;
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              const deps = pkg[section];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                let version = exact.get(name);
                if (name === 'lexical' || name.startsWith('@lexical/')) version = '0.48.0';
                if (!version) continue;
                const previous = deps[name];
                const prefix = previous.startsWith('~') ? '~' : previous.startsWith('^') ? '^' : '';
                const next = `${prefix}${version}`;
                if (previous !== next) {
                  console.log(`${file}: ${name} ${previous} -> ${next}`);
                  deps[name] = next;
                  changed = true;
                }
              }
            }
            if (changed) fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['.git', 'node_modules', 'target'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name === 'package.json') updatePackage(full);
            }
          }

          walk('.');
          NODE

      - name: Apply syntax-safe Rust dependency and source migrations
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import tomllib

          targets = {
              'cxx': '1.0.198',
              'tracing': '0.1.44',
              'regex': '1.13.1',
              'mdns-sd': '0.20.0',
              'gray_matter': '0.3.2',
              'http': '1.4.2',
              'serde': '1.0.229',
              'async-trait': '0.1.91',
              'env_logger': '0.11.9',
              'flume': '0.12.0',
          }
          seen = Counter()

          def rewrite_dependency_line(line: str, name: str, version: str) -> tuple[str, bool]:
              ending = ''
              body = line
              if body.endswith('\r\n'):
                  body, ending = body[:-2], '\r\n'
              elif body.endswith('\n'):
                  body, ending = body[:-1], '\n'

              escaped = re.escape(name)
              inline = re.compile(
                  rf'^(?P<prefix>\s*{escaped}\s*=\s*\{{[^\n}}]*?\bversion\s*=\s*)'
                  rf'(?P<quote>["\'])(?P<value>[^"\']+)(?P=quote)'
                  rf'(?P<suffix>[^\n}}]*\}}\s*(?:#.*)?)$'
              )
              simple = re.compile(
                  rf'^(?P<prefix>\s*{escaped}\s*=\s*)'
                  rf'(?P<quote>["\'])(?P<value>[^"\']+)(?P=quote)'
                  rf'(?P<suffix>\s*(?:#.*)?)$'
              )

              match = inline.match(body) or simple.match(body)
              if not match:
                  return line, False

              rewritten = (
                  f"{match.group('prefix')}{match.group('quote')}"
                  f"{version}{match.group('quote')}{match.group('suffix')}{ending}"
              )
              return rewritten, True

          manifests = [
              path for path in Path('.').rglob('Cargo.toml')
              if not any(part in {'.git', 'target'} for part in path.parts)
          ]

          for manifest in manifests:
              original_lines = manifest.read_text(encoding='utf-8').splitlines(keepends=True)
              rewritten_lines = []
              for line in original_lines:
                  current = line
                  for name, version in targets.items():
                      current, matched = rewrite_dependency_line(current, name, version)
                      if matched:
                          seen[name] += 1
                          break
                  rewritten_lines.append(current)

              text = ''.join(rewritten_lines)
              if manifest.as_posix() == 'packages/core-rs/Cargo.toml':
                  pbkdf2_pattern = re.compile(r'(?m)^\s*pbkdf2\s*=.*$')
                  text, count = pbkdf2_pattern.subn(
                      'pbkdf2 = { version = "0.13.0", features = ["sha2"] }',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit('packages/core-rs/Cargo.toml: pbkdf2 dependency not found')

              try:
                  tomllib.loads(text)
              except tomllib.TOMLDecodeError as error:
                  raise SystemExit(f'{manifest}: generated invalid TOML: {error}') from error

              original = ''.join(original_lines)
              if text != original:
                  manifest.write_text(text, encoding='utf-8', newline='\n')
                  print(f'{manifest}: dependency versions rewritten')

          missing = sorted(name for name in targets if seen[name] == 0)
          if missing:
              raise SystemExit(f'Expected Cargo dependencies were not found: {missing}')
          print('Matched dependency declarations:', dict(sorted(seen.items())))

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old in text:
                  file.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
                  print(f'{path}: applied source migration')
              elif new not in text:
                  raise SystemExit(f'{path}: expected migration anchor not found')

          replace_once(
              'packages/core-rs/src/crypto.rs',
              'use pbkdf2::pbkdf2_hmac;\nuse rand::Rng;\nuse sha2::Sha512;',
              'use pbkdf2::{pbkdf2_hmac, sha2::Sha512};\nuse rand::Rng;',
          )
          replace_once(
              'packages/core-rs/src/sync/mobile_sync/protocol/handler.rs',
              'ip_address: std::net::IpAddr::V4(*address),',
              'ip_address: address.to_ip_addr(),',
          )

          import_path = Path('packages/core-rs/src/import.rs')
          import_text = import_path.read_text(encoding='utf-8')
          old = 'let result = matter.parse(&content);'
          new = '''let result = matter
                      .parse::<serde_json::Value>(&content)
                      .map_err(|error| ImportError::GrayMatter(error.to_string()))?;'''
          count = import_text.count(old)
          if count:
              import_text = import_text.replace(old, new)
              import_path.write_text(import_text, encoding='utf-8', newline='\n')
              print(f'packages/core-rs/src/import.rs: migrated {count} parser call(s)')
          elif import_text.count('.parse::<serde_json::Value>(&content)') != 2:
              raise SystemExit('packages/core-rs/src/import.rs: expected parser migration anchors not found')
          PY

      - name: Parse and format rewritten Rust workspace
        run: |
          set -euxo pipefail
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/pre-lock-cargo-metadata.json"
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Regenerate JavaScript lockfile
        run: |
          set -euxo pipefail
          pnpm install --lockfile-only --ignore-scripts --reporter=append-only

      - name: Regenerate Rust lockfile
        run: |
          set -euxo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/cargo-metadata.json"

      - name: Inspect generated state
        run: |
          set -euxo pipefail
          git status --short
          git diff --stat
          git diff --check
          git diff -- \
            apps/desktop/package.json \
            apps/mobile/package.json \
            packages/core-rs/Cargo.toml \
            packages/core-rs/src/crypto.rs \
            packages/core-rs/src/import.rs \
            packages/core-rs/src/sync/mobile_sync/protocol/handler.rs \
            packages/relay-server/Cargo.toml

      - name: Validate generated dependency graph
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile --reporter=append-only
          node scripts/check-ipc-contract.mjs
          pnpm lint
          pnpm format --check
          pnpm type-check
          cargo check --locked -p core-rs --all-targets --all-features
          cargo check --locked -p relay-server --all-targets
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --verbose -- --nocapture
          git diff --check

      - name: Package validated payload
        run: |
          set -euxo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT)
          if (( ${#files[@]} == 0 )); then
            echo "No convergence changes remain to package."
            exit 0
          fi
          printf '%s\0' "${files[@]}" | tar --null -T - -czf dependency-convergence.tar.gz
          sha256sum dependency-convergence.tar.gz

      - name: Upload validated payload
        if: hashFiles('dependency-convergence.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-convergence
          path: dependency-convergence.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated convergence state
        run: |
          set -euxo pipefail
          if git diff --quiet; then
            echo "Validated convergence state is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock pnpm-lock.yaml \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            apps/mobile/package.json \
            packages/core-rs/Cargo.toml \
            packages/core-rs/src/crypto.rs \
            packages/core-rs/src/import.rs \
            packages/core-rs/src/sync/mobile_sync/protocol/handler.rs \
            packages/relay-server/Cargo.toml
          git diff --cached --check
          git commit -m "chore(deps): materialize validated convergence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
