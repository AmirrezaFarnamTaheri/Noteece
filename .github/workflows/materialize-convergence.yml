name: Materialize dependency convergence
run-name: "Materialize convergence | PR #${{ github.event.pull_request.number }} | ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-convergence.yml

permissions:
  contents: write

concurrency:
  group: materialize-convergence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "true"
  RUST_BACKTRACE: full

jobs:
  generate:
    name: Generate, commit, and validate convergence state
    if: >-
      github.event.pull_request.number == 152 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            wget
          pkg-config --modversion gdk-3.0
          pkg-config --modversion webkit2gtk-4.0

      - name: Apply dependency and source convergence
        run: |
          set -euxo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const exact = new Map([['date-fns', '4.4.0']]);

          function updatePackage(file) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            let changed = false;
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              const deps = pkg[section];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                let version = exact.get(name);
                if (name === 'lexical' || name.startsWith('@lexical/')) version = '0.48.0';
                if (!version) continue;
                const previous = deps[name];
                const prefix = previous.startsWith('~') ? '~' : previous.startsWith('^') ? '^' : '';
                const next = `${prefix}${version}`;
                if (previous !== next) {
                  console.log(`${file}: ${name} ${previous} -> ${next}`);
                  deps[name] = next;
                  changed = true;
                }
              }
            }
            if (changed) fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['.git', 'node_modules', 'target'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name === 'package.json') updatePackage(full);
            }
          }

          walk('.');
          NODE

          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          targets = {
              'cxx': '1.0.198',
              'tracing': '0.1.44',
              'regex': '1.13.1',
              'mdns-sd': '0.20.0',
              'gray_matter': '0.3.2',
              'http': '1.4.2',
              'serde': '1.0.229',
              'async-trait': '0.1.91',
              'env_logger': '0.11.9',
              'flume': '0.12.0',
          }
          seen = Counter()

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old in text:
                  write(path, text.replace(old, new, 1))
                  print(f'{path}: applied source migration')
              elif new not in text:
                  raise SystemExit(f'{path}: expected migration anchor not found')

          def rewrite_dependency_line(line, name, version):
              ending = ''
              body = line
              if body.endswith('\r\n'):
                  body, ending = body[:-2], '\r\n'
              elif body.endswith('\n'):
                  body, ending = body[:-1], '\n'
              escaped = re.escape(name)
              inline = re.compile(
                  rf'^(?P<prefix>\s*{escaped}\s*=\s*\{{[^\n}}]*?\bversion\s*=\s*)'
                  rf'(?P<quote>["\'])(?P<value>[^"\']+)(?P=quote)'
                  rf'(?P<suffix>[^\n}}]*\}}\s*(?:#.*)?)$'
              )
              simple = re.compile(
                  rf'^(?P<prefix>\s*{escaped}\s*=\s*)'
                  rf'(?P<quote>["\'])(?P<value>[^"\']+)(?P=quote)'
                  rf'(?P<suffix>\s*(?:#.*)?)$'
              )
              match = inline.match(body) or simple.match(body)
              if not match:
                  return line, False
              return (
                  f"{match.group('prefix')}{match.group('quote')}"
                  f"{version}{match.group('quote')}{match.group('suffix')}{ending}",
                  True,
              )

          manifests = [
              path for path in Path('.').rglob('Cargo.toml')
              if not any(part in {'.git', 'target'} for part in path.parts)
          ]
          for manifest in manifests:
              original = manifest.read_text(encoding='utf-8')
              rewritten = []
              for line in original.splitlines(keepends=True):
                  current = line
                  for name, version in targets.items():
                      current, matched = rewrite_dependency_line(current, name, version)
                      if matched:
                          seen[name] += 1
                          break
                  rewritten.append(current)
              text = ''.join(rewritten)
              if manifest.as_posix() == 'packages/core-rs/Cargo.toml':
                  text, count = re.subn(
                      r'(?m)^\s*pbkdf2\s*=.*$',
                      'pbkdf2 = { version = "0.13.0", features = ["sha2"] }',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit('packages/core-rs/Cargo.toml: pbkdf2 dependency not found')
              if text != original:
                  write(manifest, text)
                  print(f'{manifest}: dependency versions rewritten')

          missing = sorted(name for name in targets if seen[name] == 0)
          if missing:
              raise SystemExit(f'Expected Cargo dependencies were not found: {missing}')
          print('Matched dependency declarations:', dict(sorted(seen.items())))

          desktop_manifest = Path('apps/desktop/src-tauri/Cargo.toml')
          desktop_text = desktop_manifest.read_text(encoding='utf-8')
          if not re.search(r'(?m)^reqwest\s*=', desktop_text):
              anchor = 'lazy_static = "1.5.0"\n'
              if anchor not in desktop_text:
                  raise SystemExit('desktop Cargo.toml: reqwest insertion anchor not found')
              desktop_text = desktop_text.replace(
                  anchor,
                  anchor + 'reqwest = { version = "0.11", features = ["json"] }\n',
                  1,
              )
              write(desktop_manifest, desktop_text)
              print('apps/desktop/src-tauri/Cargo.toml: added reqwest')

          replace_once('packages/core-rs/src/crypto.rs', 'use pbkdf2::pbkdf2_hmac;\nuse rand::Rng;\nuse sha2::Sha512;', 'use pbkdf2::{pbkdf2_hmac, sha2::Sha512};\nuse rand::Rng;')
          replace_once('packages/core-rs/src/sync/mobile_sync/protocol/handler.rs', 'ip_address: std::net::IpAddr::V4(*address),', 'ip_address: address.to_ip_addr(),')

          import_path = Path('packages/core-rs/src/import.rs')
          import_text = import_path.read_text(encoding='utf-8')
          old_parse = 'let result = matter.parse(&content);'
          new_parse = 'let result = matter\n                    .parse::<serde_json::Value>(&content)\n                    .map_err(|error| ImportError::GrayMatter(error.to_string()))?;'
          count = import_text.count(old_parse)
          if count:
              write(import_path, import_text.replace(old_parse, new_parse))
              print(f'packages/core-rs/src/import.rs: migrated {count} parser call(s)')
          elif import_text.count('.parse::<serde_json::Value>(&content)') != 2:
              raise SystemExit('packages/core-rs/src/import.rs: parser migration anchors not found')

          replace_once('apps/desktop/src-tauri/src/commands/ai.rs', '        for post in posts {', '        let post_count = posts.len();\n        for post in &posts {')
          replace_once('apps/desktop/src-tauri/src/commands/ai.rs', 'log::info!("[AI] Ingested {} social posts", posts.len());', 'log::info!("[AI] Ingested {} social posts", post_count);')
          replace_once('apps/desktop/src-tauri/src/commands/runtime_contract.rs', 'use chrono::{NaiveDateTime, Utc};', 'use chrono::{DateTime, Utc};')
          replace_once('apps/desktop/src-tauri/src/commands/runtime_contract.rs', 'use std::collections::{BTreeMap, HashMap};', 'use std::collections::BTreeMap;')
          replace_once('apps/desktop/src-tauri/src/commands/runtime_contract.rs', 'let date = NaiveDateTime::from_timestamp_opt(transaction.date, 0)\n                .map(|value| value.date().to_string())', 'let date = DateTime::from_timestamp(transaction.date, 0)\n                .map(|value| value.date_naive().to_string())')
          replace_once('apps/desktop/src-tauri/src/concurrency_tests.rs', '    use std::path::Path;\n', '')
          replace_once('apps/desktop/src-tauri/src/commands/auth.rs', 'let mut attempts = LOGIN_ATTEMPTS.lock().map_err(|e| e.to_string())?;', 'let attempts = LOGIN_ATTEMPTS.lock().map_err(|e| e.to_string())?;')
          replace_once('apps/desktop/src-tauri/src/commands/caldav.rs', ') -> Result<CalDavAccount, String> {\n    crate::with_db!(db, conn, {', ') -> Result<CalDavAccount, String> {\n    let _space_id = space_id;\n    crate::with_db!(db, conn, {')
          replace_once('apps/desktop/src-tauri/src/commands/caldav.rs', ') -> Result<Vec<CalDavAccount>, String> {\n    crate::with_db!(db, conn, {', ') -> Result<Vec<CalDavAccount>, String> {\n    let _space_id = space_id;\n    crate::with_db!(db, conn, {')
          replace_once('apps/desktop/src-tauri/src/commands/personal_modes.rs', '    crate::with_db!(db, conn, {\n        let note = core_rs::note::create_note(&conn, &space_id, &name, &instructions)\n            .map_err(|e| e.to_string())?;', '    crate::with_db!(db, conn, {\n        let content = format!("# Ingredients\\n\\n{}\\n\\n# Instructions\\n\\n{}", ingredients, instructions);\n        let note = core_rs::note::create_note(&conn, &space_id, &name, &content)\n            .map_err(|e| e.to_string())?;')
          PY

      - name: Regenerate lockfiles and format
        run: |
          set -euxo pipefail
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/pre-lock-cargo-metadata.json"
          cargo fmt --all
          pnpm install --lockfile-only --ignore-scripts --reporter=append-only
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/cargo-metadata.json"
          git diff --check

      - name: Commit generated convergence state
        run: |
          set -euxo pipefail
          if git diff --quiet; then
            echo "Generated convergence state is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(deps): materialize convergence state"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Validate complete repository state
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile --reporter=append-only
          node scripts/check-ipc-contract.mjs
          pnpm lint
          pnpm format --check
          pnpm type-check
          cargo check --locked -p core-rs --all-targets --all-features
          cargo check --locked -p relay-server --all-targets
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --verbose -- --nocapture
          git diff --check
