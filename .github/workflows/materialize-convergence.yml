name: Materialize dependency convergence
run-name: "Materialize convergence | PR #${{ github.event.pull_request.number }} | ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-convergence.yml

permissions:
  contents: write

concurrency:
  group: materialize-convergence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  generate:
    name: Generate, validate, and commit manifests and lockfiles
    if: >-
      github.event.pull_request.number == 152 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            wget
          pkg-config --modversion gdk-3.0
          pkg-config --modversion webkit2gtk-4.0

      - name: Describe convergence environment
        run: |
          set -euxo pipefail
          git status --short --branch
          git log -1 --oneline --decorate
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Apply compatible JavaScript dependency versions
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const exact = new Map([['date-fns', '4.4.0']]);
          function updatePackage(file) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            let changed = false;
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              const deps = pkg[section];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                let version = exact.get(name);
                if (name === 'lexical' || name.startsWith('@lexical/')) version = '0.48.0';
                if (!version) continue;
                const previous = deps[name];
                const prefix = previous.startsWith('~') ? '~' : previous.startsWith('^') ? '^' : '';
                const next = `${prefix}${version}`;
                if (previous !== next) {
                  deps[name] = next;
                  changed = true;
                }
              }
            }
            if (changed) fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              if (['.git','node_modules','target'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name === 'package.json') updatePackage(full);
            }
          }
          walk('.');
          NODE

      - name: Apply compatible Rust dependency and source migrations
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          targets={'cxx':'1.0.198','tracing':'0.1.44','regex':'1.13.1','mdns-sd':'0.20.0','gray_matter':'0.3.2','http':'1.4.2','serde':'1.0.229','async-trait':'0.1.91','env_logger':'0.11.9','flume':'0.12.0'}
          for manifest in Path('.').rglob('Cargo.toml'):
              if any(part in {'.git','target'} for part in manifest.parts): continue
              text=manifest.read_text(encoding='utf-8')
              original=text
              for name,version in targets.items():
                  text=re.sub(rf'(?m)^(\s*{re.escape(name)}\s*=\s*"?)([^"\n]+)("?.*)$',rf'\g<1>{version}\g<3>',text)
              if manifest.as_posix()=='packages/core-rs/Cargo.toml':
                  text=re.sub(r'(?m)^pbkdf2\s*=.*$','pbkdf2 = { version = "0.13.0", features = ["sha2"] }',text,count=1)
              if text != original: manifest.write_text(text,encoding='utf-8',newline='\n')
          def replace_once(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if old in t: p.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')
          replace_once('packages/core-rs/src/crypto.rs','use pbkdf2::pbkdf2_hmac;\nuse rand::Rng;\nuse sha2::Sha512;','use pbkdf2::{pbkdf2_hmac, sha2::Sha512};\nuse rand::Rng;')
          replace_once('packages/core-rs/src/sync/mobile_sync/protocol/handler.rs','ip_address: std::net::IpAddr::V4(*address),','ip_address: address.to_ip_addr(),')
          p=Path('packages/core-rs/src/import.rs'); t=p.read_text(encoding='utf-8')
          t=t.replace('let result = matter.parse(&content);','let result = matter.parse::<serde_json::Value>(&content).map_err(|error| ImportError::GrayMatter(error.to_string()))?;')
          p.write_text(t,encoding='utf-8',newline='\n')
          PY

      - name: Format generated Rust sources
        run: |
          set -euxo pipefail
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Regenerate JavaScript lockfile
        run: pnpm install --lockfile-only --ignore-scripts --reporter=append-only

      - name: Regenerate Rust lockfile
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/cargo-metadata.json"

      - name: Validate generated dependency graph
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile --reporter=append-only
          node scripts/check-ipc-contract.mjs
          pnpm lint
          pnpm format --check
          pnpm type-check
          cargo check --locked -p core-rs --all-targets --all-features
          cargo check --locked -p relay-server --all-targets
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --verbose -- --nocapture
          git diff --check

      - name: Package validated payload
        run: |
          set -euxo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT)
          if (( ${#files[@]} == 0 )); then exit 0; fi
          printf '%s\0' "${files[@]}" | tar --null -T - -czf dependency-convergence.tar.gz

      - name: Upload validated payload
        if: hashFiles('dependency-convergence.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-convergence
          path: dependency-convergence.tar.gz
          retention-days: 7

      - name: Commit validated convergence state
        run: |
          set -euxo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(deps): materialize validated convergence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
