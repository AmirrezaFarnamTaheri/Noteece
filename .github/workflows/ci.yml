name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint_and_format:
    name: "Lint and Format Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Tauri IPC contract (frontend invoke vs registered commands)
        run: node scripts/check-ipc-contract.mjs

      - name: Run lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format --check

      - name: TypeScript check
        run: pnpm type-check

  desktop_tests:
    name: "Desktop Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/desktop
        run: pnpm test:ci

      - name: Run tests with coverage
        working-directory: apps/desktop
        run: pnpm test:coverage:ci

      - name: Check coverage threshold
        working-directory: apps/desktop
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
            echo "Line coverage: $COVERAGE%"
            if echo "$COVERAGE" | awk '{exit !($1 < 90)}'; then
              echo "::warning::Coverage ($COVERAGE%) is below 90% threshold"
            else
              echo "Coverage check passed: $COVERAGE%"
            fi
          else
            echo "::warning::No coverage report found"
          fi

  mobile_tests:
    name: "Mobile Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        working-directory: apps/mobile
        run: pnpm lint

      - name: Run type checking
        working-directory: apps/mobile
        run: pnpm type-check

      - name: Run tests
        working-directory: apps/mobile
        run: pnpm test:ci

  rust_checks:
    name: "Rust Checks"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check core-rs
        run: cargo check -p core-rs --verbose

      - name: Check relay-server
        run: cargo check -p relay-server --verbose

      - name: Format Check
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all -- --check

      - name: Clippy core-rs
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy -p core-rs --lib --all-features -- -D warnings

      - name: Clippy relay-server
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy -p relay-server --all-targets -- -D warnings

      - name: Test core-rs
        run: cargo test -p core-rs --verbose

      - name: Test relay-server
        run: cargo test -p relay-server --verbose

  ci-complete:
    name: "CI Complete"
    needs: [lint_and_format, desktop_tests, mobile_tests, rust_checks]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "Lint and Format: ${{ needs.lint_and_format.result }}"
          echo "Desktop Tests: ${{ needs.desktop_tests.result }}"
          echo "Mobile Tests: ${{ needs.mobile_tests.result }}"
          echo "Rust Checks: ${{ needs.rust_checks.result }}"

          if [[ "${{ needs.lint_and_format.result }}" != "success" ]] || \
             [[ "${{ needs.desktop_tests.result }}" != "success" ]] || \
             [[ "${{ needs.mobile_tests.result }}" != "success" ]] || \
             [[ "${{ needs.rust_checks.result }}" != "success" ]]; then
            echo "One or more checks failed!"
            exit 1
          fi

          echo "CI completed successfully!"
