name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint_and_format:
    name: "Lint and Format Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format --check

      - name: TypeScript check
        run: pnpm type-check

  desktop_tests:
    name: "Desktop Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/desktop
        run: pnpm test:ci

      - name: Run tests with coverage
        working-directory: apps/desktop
        run: pnpm test:coverage:ci

      - name: Check coverage threshold
        working-directory: apps/desktop
        env:
          # Set the COVERAGE_MIN repo variable (e.g. 80) to make this gate
          # blocking once a baseline exists; empty keeps it advisory.
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::warning::No coverage report found"
            exit 0
          fi
            COVERAGE=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')
            echo "Line coverage: $COVERAGE%"
            if [ -z "$COVERAGE_MIN" ]; then
              if echo "$COVERAGE" | awk '{exit !($1 < 90)}'; then
                echo "::warning::Coverage ($COVERAGE%) is below the 90% target"
              fi
              exit 0
            fi
            if echo "$COVERAGE" "$COVERAGE_MIN" | awk '{exit !($1 < $2)}'; then
              echo "::error::Coverage ($COVERAGE%) is below required minimum ($COVERAGE_MIN%)"
              exit 1
            fi
            echo "Coverage gate passed: $COVERAGE% >= $COVERAGE_MIN%"

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: desktop-coverage
          path: apps/desktop/coverage

  mobile_tests:
    name: "Mobile Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        working-directory: apps/mobile
        run: pnpm lint

      - name: Run type checking
        working-directory: apps/mobile
        run: pnpm type-check

      - name: Run tests
        working-directory: apps/mobile
        run: pnpm test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: mobile-coverage
          path: apps/mobile/coverage

  rust_checks:
    name: "Rust Checks"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        # Pin Rust toolchain for reproducible builds (Finding O4)
        # Update this version periodically after testing with new Rust releases
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce7feac0f09e67c2e95f581 # stable
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/core-rs/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check core-rs
        run: cd packages/core-rs && cargo check --verbose

      - name: Format Check
        if: matrix.os == 'ubuntu-22.04'
        run: cd packages/core-rs && cargo fmt -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-22.04'
        run: cd packages/core-rs && cargo clippy --lib --all-features -- -D warnings

      - name: Test
        run: cd packages/core-rs && cargo test --verbose

      - name: Test relay-server
        run: cargo test -p relay-server --verbose

      - name: Generate test coverage (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd packages/core-rs
          cargo install cargo-tarpaulin --version 0.27.0 --locked
          cargo tarpaulin --out Xml --skip-clean --timeout 300 --fail-under 60

  desktop_build:
    name: "Desktop Build Check"
    needs: [rust_checks, lint_and_format]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (System)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce7feac0f09e67c2e95f581 # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install dependencies (Project)
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: cd apps/desktop && pnpm build

      - name: Check Tauri Build
        run: cd apps/desktop && cargo build --manifest-path src-tauri/Cargo.toml

  codeql:
    name: "CodeQL SAST Analysis"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'rust']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8

  security_audit:
    name: "Security Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce7feac0f09e67c2e95f581 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        working-directory: packages/core-rs

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate

  secret_scanning:
    name: "Secret Scanning"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --only-verified

  # Performance benchmarks should be run periodically (e.g., weekly or before releases).
  # Use the perf-harness binary (packages/perf-harness) to measure relay throughput,
  # sync latency, and memory usage under load. Run manually or as a scheduled workflow.
  # Example: cargo run -p perf-harness -- --mode benchmark --duration 60

  # Summary job that depends on all checks
  ci-complete:
    name: "CI Complete"
    needs: [lint_and_format, desktop_tests, mobile_tests, rust_checks, desktop_build, codeql, security_audit, secret_scanning]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          echo "Lint and Format: ${{ needs.lint_and_format.result }}"
          echo "Desktop Tests: ${{ needs.desktop_tests.result }}"
          echo "Mobile Tests: ${{ needs.mobile_tests.result }}"
          echo "Rust Checks: ${{ needs.rust_checks.result }}"
          echo "Desktop Build: ${{ needs.desktop_build.result }}"
          
          echo "CodeQL SAST: ${{ needs.codeql.result }}"
          echo "Security Audit: ${{ needs.security_audit.result }}"
          echo "Secret Scanning: ${{ needs.secret_scanning.result }}"
          
          if [[ "${{ needs.lint_and_format.result }}" != "success" ]] || \
             [[ "${{ needs.desktop_tests.result }}" != "success" ]] || \
             [[ "${{ needs.mobile_tests.result }}" != "success" ]] || \
             [[ "${{ needs.rust_checks.result }}" != "success" ]] || \
             [[ "${{ needs.desktop_build.result }}" != "success" ]] || \
             [[ "${{ needs.codeql.result }}" != "success" ]] || \
             [[ "${{ needs.security_audit.result }}" != "success" ]] || \
             [[ "${{ needs.secret_scanning.result }}" != "success" ]]; then
            echo "One or more checks failed!"
            exit 1
          fi
          
          echo "CI completed successfully!"
