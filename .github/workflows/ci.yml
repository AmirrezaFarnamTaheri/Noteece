name: CI
run-name: "CI | ${{ github.event_name }} | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "true"
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  finalize_windows_durability:
    name: "Temporary | finalize Windows backup durability"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 152 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply best-effort Windows directory durability
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/core-rs/src/social/backup.rs')
          text = path.read_text(encoding='utf-8')

          old_import = '''use std::io::Write;
use std::path::{Path, PathBuf};
'''
          new_import = '''use std::io::Write;
#[cfg(windows)]
use std::os::windows::fs::OpenOptionsExt;
use std::path::{Path, PathBuf};
'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('Windows OpenOptionsExt import anchor not found')

          old_impl = '''#[cfg(windows)]
fn sync_directory(_path: &Path) -> std::io::Result<()> {
    // Windows does not expose a portable directory-fsync equivalent.
    // The temporary backup file is already flushed before the atomic
    // rename, so an unsupported directory metadata flush must not turn
    // a successfully persisted backup into a false failure.
    Ok(())
}
'''
          new_impl = '''#[cfg(windows)]
fn sync_directory(path: &Path) -> std::io::Result<()> {
    // Opening a directory on Windows requires backup semantics. Attempt the
    // metadata flush so rename/delete durability is preserved where supported,
    // while treating documented unsupported-directory cases as best effort.
    const FILE_FLAG_BACKUP_SEMANTICS: u32 = 0x0200_0000;
    let directory = match OpenOptions::new()
        .read(true)
        .custom_flags(FILE_FLAG_BACKUP_SEMANTICS)
        .open(path)
    {
        Ok(directory) => directory,
        Err(error) if is_unsupported_directory_sync_error(&error) => return Ok(()),
        Err(error) => return Err(error),
    };

    match directory.sync_all() {
        Ok(()) => Ok(()),
        Err(error) if is_unsupported_directory_sync_error(&error) => Ok(()),
        Err(error) => Err(error),
    }
}

#[cfg(windows)]
fn is_unsupported_directory_sync_error(error: &std::io::Error) -> bool {
    matches!(
        error.kind(),
        std::io::ErrorKind::PermissionDenied | std::io::ErrorKind::Unsupported
    ) || matches!(
        error.raw_os_error(),
        Some(1) | Some(5) | Some(6) | Some(50) | Some(87)
    )
}
'''
          if old_impl in text:
              text = text.replace(old_impl, new_impl, 1)
          elif new_impl not in text:
              raise SystemExit('Windows directory durability anchor not found')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit durability fix when needed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          if git diff --quiet; then
            echo "Windows directory durability is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core-rs/src/social/backup.rs
          git diff --cached --check
          git commit -m "fix(backup): restore best-effort Windows directory durability"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

  lint_and_format:
    name: "JS/TS | lint, format, types, IPC contract"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Describe execution environment
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short --branch
          node --version
          npm --version
          pnpm --version
          pnpm list --depth 0 --recursive || true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Verify Tauri IPC contract
        run: node scripts/check-ipc-contract.mjs

      - name: Run repository lint
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format --check

      - name: Run TypeScript checks
        run: pnpm type-check

  desktop_tests:
    name: "Desktop | tests and coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Run desktop coverage
        working-directory: apps/desktop
        run: pnpm test:coverage:ci -- --runInBand --coverageReporters=json-summary --coverageReporters=text

      - name: Evaluate coverage
        working-directory: apps/desktop
        run: |
          set -euxo pipefail
          if [[ ! -f coverage/coverage-summary.json ]]; then
            echo "::warning::Coverage summary not emitted; tests passed and coverage remains informational"
            exit 0
          fi
          jq . coverage/coverage-summary.json

  mobile_tests:
    name: "Mobile | lint, types, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Verify Expo dependency alignment
        working-directory: apps/mobile
        run: pnpm exec expo install --check

      - name: Run mobile lint
        working-directory: apps/mobile
        run: pnpm lint

      - name: Run mobile type checking
        working-directory: apps/mobile
        run: pnpm type-check

      - name: Run mobile tests
        working-directory: apps/mobile
        run: pnpm test:ci -- --runInBand

  rust_msrv:
    name: "Rust | MSRV 1.89"
    # Tauri v1 links WebKitGTK 4.0, which is not packaged on Ubuntu 24.04.
    # Keep native Rust validation on 22.04 until the Tauri v2/WebKitGTK 4.1 migration.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - name: Cache Rust build state
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.89

      - name: Install Linux desktop system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            wget
          pkg-config --modversion gdk-3.0
          pkg-config --modversion webkit2gtk-4.0

      - name: Verify declared MSRV
        run: |
          set -euxo pipefail
          rustc -Vv
          cargo -Vv
          mkdir -p apps/desktop/dist
          printf '<!doctype html><html><body></body></html>\n' > apps/desktop/dist/index.html
          cargo check --locked --workspace --all-targets --all-features

  rust_checks:
    name: "Rust | ${{ matrix.label }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tauri v1 requires WebKitGTK 4.0; retain 22.04 until Tauri v2 migration.
          - os: ubuntu-22.04
            label: Linux
            lint: true
          - os: macos-latest
            label: macOS
            lint: false
          - os: windows-2022
            label: Windows 2022
            lint: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build state
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            wget
          pkg-config --modversion gdk-3.0
          pkg-config --modversion webkit2gtk-4.0

      - name: Select Strawberry Perl for Windows OpenSSL
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { throw "Missing Strawberry Perl" }
          "OPENSSL_SRC_PERL=$perl" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $perl -MLocale::Maketext::Simple -e "print qq(ok\n)"

      - name: Describe Rust environment
        run: |
          set -euxo pipefail
          rustc -Vv
          cargo -Vv
          git ls-files --eol Cargo.lock pnpm-lock.yaml packages/core-rs/config/bundled_selectors.json

      - name: Check core-rs
        run: cargo check --locked -p core-rs --all-targets --all-features

      - name: Check relay-server
        run: cargo check --locked -p relay-server --all-targets

      - name: Rust format
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --verbose -- --nocapture

  ci_complete:
    name: "Required CI gate"
    needs: [lint_and_format, desktop_tests, mobile_tests, rust_msrv, rust_checks]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Publish consolidated result
        env:
          LINT_RESULT: ${{ needs.lint_and_format.result }}
          DESKTOP_RESULT: ${{ needs.desktop_tests.result }}
          MOBILE_RESULT: ${{ needs.mobile_tests.result }}
          MSRV_RESULT: ${{ needs.rust_msrv.result }}
          RUST_RESULT: ${{ needs.rust_checks.result }}
        run: |
          set -euxo pipefail
          echo "JS/TS=${LINT_RESULT} Desktop=${DESKTOP_RESULT} Mobile=${MOBILE_RESULT} MSRV=${MSRV_RESULT} Rust=${RUST_RESULT}"
          [[ "$LINT_RESULT" == success && "$DESKTOP_RESULT" == success && "$MOBILE_RESULT" == success && "$MSRV_RESULT" == success && "$RUST_RESULT" == success ]]
