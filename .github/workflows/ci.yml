name: CI
run-name: "CI | ${{ github.event_name }} | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "true"
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint_and_format:
    name: "JS/TS | lint, format, types, IPC contract"
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Describe execution environment
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short --branch
          node --version
          npm --version
          pnpm --version
          pnpm list --depth 0 --recursive || true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Verify Tauri IPC contract
        run: node scripts/check-ipc-contract.mjs

      - name: Run repository lint
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format --check

      - name: Run TypeScript checks
        run: pnpm type-check

  desktop_tests:
    name: "Desktop | tests and coverage"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Run desktop tests
        working-directory: apps/desktop
        run: pnpm test:ci -- --runInBand

      - name: Run desktop coverage
        working-directory: apps/desktop
        run: pnpm test:coverage:ci -- --runInBand --coverageReporters=json-summary --coverageReporters=text

      - name: Evaluate coverage
        working-directory: apps/desktop
        run: |
          set -euxo pipefail
          if [[ ! -f coverage/coverage-summary.json ]]; then
            echo "::warning::Coverage summary not emitted; tests passed and coverage remains informational"
            exit 0
          fi
          jq . coverage/coverage-summary.json

  mobile_tests:
    name: "Mobile | lint, types, tests"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Run mobile lint
        working-directory: apps/mobile
        run: pnpm lint

      - name: Run mobile type checking
        working-directory: apps/mobile
        run: pnpm type-check

      - name: Run mobile tests
        working-directory: apps/mobile
        run: pnpm test:ci -- --runInBand

  rust_checks:
    name: "Rust | ${{ matrix.label }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            lint: true
          - os: macos-latest
            label: macOS
            lint: false
          - os: windows-2022
            label: Windows 2022
            lint: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Select Strawberry Perl for Windows OpenSSL
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { throw "Missing Strawberry Perl" }
          "OPENSSL_SRC_PERL=$perl" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $perl -MLocale::Maketext::Simple -e "print qq(ok\n)"

      - name: Describe Rust environment
        run: |
          set -euxo pipefail
          rustc -Vv
          cargo -Vv
          git ls-files --eol Cargo.lock pnpm-lock.yaml packages/core-rs/config/bundled_selectors.json

      - name: Check core-rs
        run: cargo check --locked -p core-rs --all-targets --all-features

      - name: Check relay-server
        run: cargo check --locked -p relay-server --all-targets

      - name: Rust format
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --verbose -- --nocapture

  ci_complete:
    name: "Required CI gate"
    needs: [lint_and_format, desktop_tests, mobile_tests, rust_checks]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Publish consolidated result
        env:
          LINT_RESULT: ${{ needs.lint_and_format.result }}
          DESKTOP_RESULT: ${{ needs.desktop_tests.result }}
          MOBILE_RESULT: ${{ needs.mobile_tests.result }}
          RUST_RESULT: ${{ needs.rust_checks.result }}
        run: |
          set -euxo pipefail
          echo "JS/TS=${LINT_RESULT} Desktop=${DESKTOP_RESULT} Mobile=${MOBILE_RESULT} Rust=${RUST_RESULT}"
          [[ "$LINT_RESULT" == success && "$DESKTOP_RESULT" == success && "$MOBILE_RESULT" == success && "$RUST_RESULT" == success ]]
