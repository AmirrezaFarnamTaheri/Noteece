name: Upgrade mobile Expo SDK
run-name: "Upgrade Expo | PR #${{ github.event.pull_request.number }} | ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upgrade-expo.yml

permissions:
  contents: write

concurrency:
  group: upgrade-expo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  migrate:
    name: Upgrade, regenerate, commit, and validate Expo SDK 57
    if: >-
      github.event.pull_request.number == 152 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install migration baseline
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Align Expo SDK 57 dependency graph
        run: |
          set -euxo pipefail

          node <<'NODE'
          const fs = require('fs');

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          const overrides = root.pnpm?.overrides ?? {};
          for (const key of ['react', 'react-dom', 'react-test-renderer', '@types/react', 'typescript']) {
            delete overrides[key];
          }
          Object.assign(overrides, {
            'shell-quote@<=1.8.4': '1.9.0',
            '@remix-run/router@<=1.23.1': '1.23.2',
            'minimatch@3.1.2': '3.1.4',
            'picomatch@2.3.1': '2.3.2',
            'picomatch@4.0.3': '4.0.4',
            'lodash-es@4.17.21': '4.18.0',
            'lodash@4.17.21': '4.18.0',
            '@xmldom/xmldom@0.8.11': '0.8.13',
            'ws@7.5.10': '7.5.11',
            'ws@8.18.3': '8.21.0',
            'brace-expansion@<=5.0.7': '5.0.8',
            'js-yaml@3.14.1': '3.15.0',
            'js-yaml@4.1.0': '4.3.0',
          });
          root.pnpm = { ...(root.pnpm ?? {}), overrides };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          const mobilePath = 'apps/mobile/package.json';
          const mobile = JSON.parse(fs.readFileSync(mobilePath, 'utf8'));
          delete mobile.devDependencies['@expo/config-plugins'];
          delete mobile.devDependencies['@types/i18next'];
          delete mobile.devDependencies['@types/react-i18next'];
          delete mobile.dependencies['react-native-ssl-pinning'];
          mobile.devDependencies['@testing-library/react-native'] = '^13.2.0';
          mobile.devDependencies.typescript = '5.9.3';
          mobile.expo = {
            doctor: {
              appConfigFieldsNotSyncedCheck: { enabled: false },
              reactNativeDirectoryCheck: {
                enabled: true,
                exclude: ['expo-av'],
                listUnknownPackages: false,
              },
            },
          };
          fs.writeFileSync(mobilePath, JSON.stringify(mobile, null, 2) + '\n');
          fs.writeFileSync('apps/mobile/.gitignore', '.expo\n.expo/\nnode_modules/\n');

          const pluginPath = 'apps/mobile/plugins/withShareExtension.js';
          const plugin = fs.readFileSync(pluginPath, 'utf8');
          const updatedPlugin = plugin.replace(
            "require('@expo/config-plugins')",
            "require('expo/config-plugins')",
          );
          if (updatedPlugin === plugin && !plugin.includes("require('expo/config-plugins')")) {
            throw new Error('Share extension config-plugin import anchor not found');
          }
          fs.writeFileSync(pluginPath, updatedPlugin);

          const legacyFileSystemUsers = [
            'apps/mobile/src/lib/backup.ts',
            'apps/mobile/src/lib/data-utils.ts',
            'apps/mobile/src/screens/SocialAnalytics.tsx',
            'apps/mobile/src/screens/SocialSettings.tsx',
            'apps/mobile/src/utils/platform.ts',
          ];
          for (const file of legacyFileSystemUsers) {
            const source = fs.readFileSync(file, 'utf8');
            const migrated = source.replace(
              "from 'expo-file-system';",
              "from 'expo-file-system/legacy';",
            );
            if (migrated === source && !source.includes("from 'expo-file-system/legacy';")) {
              throw new Error(`${file}: expo-file-system import anchor not found`);
            }
            fs.writeFileSync(file, migrated);
          }

          const morePath = 'apps/mobile/app/(tabs)/more.tsx';
          let more = fs.readFileSync(morePath, 'utf8');
          const promptCallbackMigrations = [
            ['onPress: (rawCurrentPassword) => {', 'onPress: (rawCurrentPassword?: string) => {'],
            ['onPress: (rawNewPassword) => {', 'onPress: (rawNewPassword?: string) => {'],
            ['onPress: async (rawConfirmPassword) => {', 'onPress: async (rawConfirmPassword?: string) => {'],
          ];
          for (const [before, after] of promptCallbackMigrations) {
            if (more.includes(before)) more = more.replace(before, after);
            else if (!more.includes(after)) throw new Error(`${morePath}: prompt callback migration anchor not found: ${before}`);
          }
          fs.writeFileSync(morePath, more);
          NODE

          git rm -r --cached --ignore-unmatch apps/mobile/.expo

          cd apps/mobile
          pnpm exec expo install 'expo@^57.0.0' --fix --pnpm
          pnpm exec expo install \
            expo-system-ui \
            react-dom \
            react-native-safe-area-context \
            react-native-web \
            react-native-worklets \
            --pnpm
          pnpm exec expo install --fix --pnpm
          cd ../..
          pnpm install --lockfile-only --reporter=append-only

      - name: Commit dependency migration state
        run: |
          set -euxo pipefail
          git diff --check
          if git diff --quiet && git diff --cached --quiet; then
            echo "Dependency migration state is already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              package.json \
              apps/mobile/package.json \
              apps/mobile/.gitignore \
              apps/mobile/plugins/withShareExtension.js \
              'apps/mobile/app/(tabs)/more.tsx' \
              apps/mobile/src/lib/backup.ts \
              apps/mobile/src/lib/data-utils.ts \
              apps/mobile/src/screens/SocialAnalytics.tsx \
              apps/mobile/src/screens/SocialSettings.tsx \
              apps/mobile/src/utils/platform.ts \
              pnpm-lock.yaml
            git diff --cached --check
            git commit -m "fix(security): pin patched transitive JavaScript dependencies"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Regenerate native projects
        run: |
          set -euxo pipefail
          cd apps/mobile
          pnpm exec expo prebuild --clean --no-install
          cd ../..

          python3 <<'PY'
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z'],
          ).decode('utf-8').split('\0')
          for name in changed:
              if not name:
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if b'\0' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              lines = text.splitlines(keepends=True)
              normalized = ''.join(
                  line.rstrip(' \t\r\n') + ('\r\n' if line.endswith('\r\n') else '\n' if line.endswith('\n') else '')
                  for line in lines
              )
              if normalized != text:
                  path.write_text(normalized, encoding='utf-8', newline='')
                  print(f'normalized trailing whitespace: {name}')
          PY

      - name: Commit regenerated native projects
        run: |
          set -euxo pipefail
          git diff --check
          if git diff --quiet; then
            echo "Native projects are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/android apps/mobile/ios apps/mobile/app.json
            git diff --cached --check
            git commit -m "chore(mobile): regenerate native projects after compatibility fixes"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Validate migrated mobile project
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile --reporter=append-only
          pnpm --dir apps/mobile exec expo install --check
          printf '.expo\n.expo/\nnode_modules/\n' > apps/mobile/.gitignore
          mkdir -p apps/mobile/.expo
          git check-ignore --no-index -v apps/mobile/.expo
          (
            cd apps/mobile
            pnpm dlx expo-doctor@latest
          )
          pnpm --dir apps/mobile lint
          pnpm --dir apps/mobile type-check
          pnpm --dir apps/mobile test:ci -- --runInBand
          pnpm audit --prod --audit-level high
